    AI systems produced substantial Lean and prose. All executable claims in
    scope were accepted by Lean; the challenge deliberately contains the two
    `sorry` placeholders required by Comparator and those are excluded from
    the project sorry count.

fidelity:
  divergences: >
    The paper states existence of a small outer sector and a smaller closed
    inner sector. The formal statement fixes explicit angles 1/200 and 1/400
    and additionally exposes the wider 1/100 proof sector needed for the
    affine parameter shift. It also makes the saddle branch, holomorphy,
    nonvanishing, quotient definition of the error, and derivative estimates
    explicit. These are strengthenings/clarifications, not weakened claims.

review:
  status: "agent-reviewed"
  reviewers:
    - "Multiple independent AI analytic, algebraic, Lean, reproducibility, and hostile-review agents"
  notes: >
    No human expert or peer review has occurred and none is claimed. Earlier
    AI reviews found substantive transcription and contour issues; those were
    repaired and re-reviewed. The current release still requires Palomar's
    own Comparator/NanoDa run and automated editorial assessment. Palomar is
    not peer review, does not establish novelty, and does not verify the
    informal manuscript proof independently of the formal statement.

alignment:
  namespace: "JensenT5Public"
  statements:
    - source: "Exact xi-coefficient normalization used by Theorem 7.1"
      lean: "centered_xi_continuation_agrees_at_positive_integers"
      module: "Challenge.TheoremSevenOne / Solution.TheoremSevenOne"
      status: "proved"
      note: >
        Identifies the theta/Gamma continuation with the even Taylor
        coefficient of Riemann's centered xi function at every positive integer.
    - source: "Manuscript Theorem 7.1"
      lean: "sectorial_centered_xi_coefficient_asymptotic"
      module: "Challenge.TheoremSevenOne / Solution.TheoremSevenOne"
      status: "proved"
      note: >
        The Challenge itself imports only Mathlib and spells out the theta
        Mellin moment, Gamma quotient, exact coefficient continuation, saddle
        equation, curvature, displayed main, and the three fixed sectors.
    - source: "Theorem 7.1 proportional-disc Cauchy consequence"
      lean: "sectorial_centered_xi_error_derivatives_through_six"
      module: "Challenge.TheoremSevenOne / Solution.TheoremSevenOne"
      status: "proved"
      note: "Covers every derivative order used by the sixth-order residual argument."

palomar:
  project_path: ""
  challenge_file: "comparator/Challenge/TheoremSevenOne.lean"
