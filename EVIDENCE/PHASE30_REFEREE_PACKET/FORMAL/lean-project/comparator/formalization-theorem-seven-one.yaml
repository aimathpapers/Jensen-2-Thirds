        maintainer; semantic mutation tests; Comparator-oriented challenge
        separation; repeated AI-only adversarial reviews.
      cost:
        wall_time: "multi-phase research and formalization project"
        spend_usd: "subscription-based and API-assisted usage; not separately itemized"
        hardware: "Apple Silicon workstation plus hosted model inference"
      prompting_notes: >
        The human maintainer selected the mathematical direction, requested
        staged exact-algebra-first formalization, ran the independent
        Mathematica notebook, and directed repair of every reported blocker.
    - method: "manual"
      models: []
      framework: "Human direction and clean-room computer algebra"
      tool_setup: "Wolfram Mathematica and review of generated artifacts"
