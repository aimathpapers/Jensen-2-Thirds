status:
  scope: >
    Three compared declarations formalize the paper's analytic input T5 and
    its normalization seam: agreement with the actual centered-xi Taylor
    coefficient at positive integers, the exact three-sector coefficient
    asymptotic, and the proportional-disc Cauchy estimates for its
    relative-error derivatives through order six.
    This Palomar topic does not by itself state the final Jensen-polynomial
    hyperbolicity theorem; that result uses this input together with T1-T4
    and the algebraic/finite-free-convolution chain in the substantive repo.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: ["propext", "Classical.choice", "Quot.sound"]
  main_results:
    - declaration: "centered_xi_continuation_agrees_at_positive_integers"
      file: "comparator/Solution/TheoremSevenOne.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      comparator_config: "comparator/config-theorem-seven-one.json"
      literature_dependencies: []
    - declaration: "sectorial_centered_xi_coefficient_asymptotic"
      file: "comparator/Solution/TheoremSevenOne.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      comparator_config: "comparator/config-theorem-seven-one.json"
      literature_dependencies: []
    - declaration: "sectorial_centered_xi_error_derivatives_through_six"
      file: "comparator/Solution/TheoremSevenOne.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
